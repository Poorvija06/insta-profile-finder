<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Profile Finder</title>
    <style>
        :root {
            --ink: #202124;
            --muted: #6d6a67;
            --paper: #fffaf4;
            --line: #e7ddd2;
            --accent: #e85d45;
            --accent-dark: #b83d31;
            --teal: #2f7d78;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 16px;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 15%, #ffd9bd 0, transparent 28%),
                radial-gradient(circle at 85% 85%, #cde9df 0, transparent 30%),
                var(--paper);
            font-family: Georgia, "Times New Roman", serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.28;
            background-image: radial-gradient(#d9c8b7 0.7px, transparent 0.7px);
            background-size: 14px 14px;
            pointer-events: none;
        }

        h1 {
            margin: 0 0 28px;
            max-width: 520px;
            font-size: 4rem;
            line-height: 0.96;
            letter-spacing: 0;
        }

        .search-profile,
        #load,
        #profile {
            width: min(100%, 520px);
        }

        .search-profile {
            display: flex;
            gap: 10px;
            padding: 7px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow: 0 14px 35px rgba(91, 63, 44, 0.1);
        }

        input {
            min-width: 0;
            flex: 1;
            border: 0;
            outline: 0;
            padding: 12px 14px;
            color: var(--ink);
            background: transparent;
            font: 1rem Georgia, "Times New Roman", serif;
        }

        input::placeholder {
            color: var(--muted);
        }

        input:focus-visible {
            box-shadow: inset 0 -2px var(--teal);
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 0 20px;
            color: #fff;
            background: var(--accent);
            font: 700 0.95rem Georgia, "Times New Roman", serif;
            cursor: pointer;
            transition: background 160ms ease, transform 160ms ease;
        }

        button:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #f2b84b;
            outline-offset: 3px;
        }

        #load {
            min-height: 24px;
            margin-top: 16px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        #profile {
            margin-top: 4px;
        }

        #profile > p {
            color: var(--accent-dark);
        }

        .profile-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 22px 24px;
            border-left: 5px solid var(--teal);
            border-radius: 4px 14px 14px 4px;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: 0 16px 35px rgba(91, 63, 44, 0.12);
            animation: appear 280ms ease-out both;
        }

        .profile-main {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .profile-avatar,
        .avatar-fallback {
            width: 68px;
            height: 68px;
            flex-shrink: 0;
            border-radius: 50%;
        }

        .profile-avatar {
            display: block;
            object-fit: cover;
            border: 3px solid #f2b84b;
        }

        .avatar-fallback {
            display: grid;
            place-items: center;
            color: #fff;
            background: var(--teal);
            font: 700 1.2rem Georgia, "Times New Roman", serif;
        }

        .profile-card h2 {
            margin: 0;
            overflow-wrap: anywhere;
            font-size: 1.5rem;
        }

        .profile-meta {
            display: flex;
            gap: 18px;
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .profile-meta strong {
            display: block;
            color: var(--ink);
            font-size: 1rem;
        }

        .profile-card a {
            flex-shrink: 0;
            color: var(--teal);
            font-weight: 700;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 520px) {
            h1 {
                margin-bottom: 22px;
                font-size: 2.7rem;
            }

            .search-profile,
            .profile-card {
                align-items: stretch;
                flex-direction: column;
            }

            .profile-main {
                align-items: flex-start;
            }

            button {
                min-height: 44px;
            }
        }
    </style>
</head>
<body>
    <h1>🔎 Instagram Profile finder</h1>
    <div class="search-profile">
        <input id="user" placeholder="Enter username">
        <button onclick="findProfile()">Search</button>
    </div>
    <div id="load"></div>
    <div id="profile"></div>
    <script>
    function findProfile() {
       const username = document.getElementById("user").value.trim();
       const profile = document.getElementById("profile");
       const loading = document.getElementById("load");
       if (username === "") {
        profile.innerHTML = `<p> Please enter a username</p>`;
        return;
       }
         loading.innerHTML = "";
         const url = "https://www.instagram.com/" + encodeURIComponent(username) + "/";
         const initials = username.slice(0, 2).toUpperCase();
         profile.innerHTML = `<div class="profile-card">
            <div class="profile-main">
                <img class="profile-avatar" src="https://unavatar.io/instagram/${encodeURIComponent(username)}" alt="${username} profile picture" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
                <div class="avatar-fallback" style="display: none;">${initials}</div>
                <div>
                <h2>@${username}</h2>
                <div class="profile-meta">
                </div>
                </div>
            </div>
            <a href="${url}" target="_blank" rel="noopener noreferrer">
                Open Instagram profile
            </a>
         </div>`;
     }
    </script>
</body>
</html>
